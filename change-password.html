<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>পাসওয়ার্ড পরিবর্তন</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#007bff">
  <script src="/pwa.js" defer></script>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-analytics-compat.js"></script>
  
  <script src="/config.js"></script>
  
  <script src="components-inline.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Noto Sans Bengali', sans-serif; background: #f0f4f8; }
    
    .password-page {
      max-width: 500px;
      margin: 80px auto 40px;
      padding: 0 20px;
    }
    
    .password-card {
      background: white;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    
    .password-card h2 {
      font-size: 24px;
      color: #0f172a;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .password-card h2 i {
      color: #3b82f6;
    }
    
    .form-group {
      margin-bottom: 16px;
    }
    
    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 4px;
      font-size: 14px;
      color: #334155;
    }
    
    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      font-family: inherit;
      transition: 0.15s;
    }
    
    .form-group input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
    }
    
    .password-strength {
      height: 4px;
      border-radius: 4px;
      margin-top: 6px;
      transition: all 0.3s ease;
    }
    .password-strength.weak { background: #ef4444; width: 33%; }
    .password-strength.medium { background: #f59e0b; width: 66%; }
    .password-strength.strong { background: #22c55e; width: 100%; }
    .password-strength.empty { background: #e2e8f0; width: 0%; }
    
    .btn-change {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 8px;
    }
    
    .btn-change:hover {
      transform: scale(1.02);
      box-shadow: 0 4px 16px rgba(59,130,246,0.3);
    }
    
    #passwordMsg {
      display: none;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 16px;
    }
    
    .input-wrapper {
      position: relative;
    }
    
    .input-wrapper input {
      width: 100%;
      padding-right: 45px;
    }
    
    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #94a3b8;
      transition: color 0.3s;
    }
    
    .toggle-password:hover {
      color: #475569;
    }
  </style>
</head>
<body data-auto-load-components>
  <div id="header-container"></div>
  
  <div style="display: flex; min-height: calc(100vh - 64px); margin-top: 64px;">
    <div id="sidebar-container"></div>
    
    <main style="flex: 1; padding: 24px; background: #f0f4f8;">
      <div class="password-page">
        <div class="password-card">
          <h2><i class="fas fa-key"></i> পাসওয়ার্ড পরিবর্তন</h2>
          
          <div id="passwordMsg"></div>
          
          <div class="form-group">
            <label>বর্তমান পাসওয়ার্ড</label>
            <div class="input-wrapper">
              <input type="password" id="currentPassword" placeholder="বর্তমান পাসওয়ার্ড লিখুন">
              <span class="toggle-password" onclick="togglePassword('currentPassword')">
                <i class="fas fa-eye"></i>
              </span>
            </div>
          </div>
          
          <div class="form-group">
            <label>নতুন পাসওয়ার্ড</label>
            <div class="input-wrapper">
              <input type="password" id="newPassword" placeholder="নতুন পাসওয়ার্ড লিখুন (৬ অক্ষরের বেশি)">
              <span class="toggle-password" onclick="togglePassword('newPassword')">
                <i class="fas fa-eye"></i>
              </span>
            </div>
            <div class="password-strength empty"></div>
            <small style="color: #94a3b8; font-size: 12px;">পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে</small>
          </div>
          
          <div class="form-group">
            <label>নতুন পাসওয়ার্ড নিশ্চিত করুন</label>
            <div class="input-wrapper">
              <input type="password" id="confirmPassword" placeholder="আবার নতুন পাসওয়ার্ড লিখুন">
              <span class="toggle-password" onclick="togglePassword('confirmPassword')">
                <i class="fas fa-eye"></i>
              </span>
            </div>
          </div>
          
          <button class="btn-change" id="changePasswordBtn">
            <i class="fas fa-sync-alt"></i> পাসওয়ার্ড পরিবর্তন করুন
          </button>
        </div>
      </div>
    </main>
  </div>
  
  <div id="footer-container"></div>
  
  <script>
    // ১. পাসওয়ার্ড ভিজিবিলিটি টগল ফাংশন (গ্লোবাল স্কোপে থাকবে)
    function togglePassword(inputId) {
      const input = document.getElementById(inputId);
      const icon = input.parentElement.querySelector('.toggle-password i');
      if (input && icon) {
        if (input.type === 'password') {
          input.type = 'text';
          icon.className = 'fas fa-eye-slash';
        } else {
          input.type = 'password';
          icon.className = 'fas fa-eye';
        }
      }
    }
    
    document.addEventListener('DOMContentLoaded', function() {
      const msgDiv = document.getElementById('passwordMsg');
      
      // ২. সেশন ভেরিফিকেশন ও পেজ প্রোটেকশন
      const userPhone = sessionStorage.getItem('userPhone') || sessionStorage.getItem('loggedInUser');
      if (!userPhone) {
        window.location.href = 'login.html';
        return;
      }

      // ৩. পাসওয়ার্ড শক্তি চেক (আপনার অরিজিনাল লজিক)
      document.getElementById('newPassword').addEventListener('input', function() {
        const strength = this.value.length === 0 ? 'empty' :
                         this.value.length < 6 ? 'weak' :
                         this.value.length < 10 ? 'medium' : 'strong';
        const indicator = document.querySelector('.password-strength');
        if (indicator) {
          indicator.className = `password-strength ${strength}`;
        }
      });
      
      // ৪. 🔥 টাইমিং সেফগার্ড: config.js সফলভাবে রেডি হওয়া নিশ্চিত করার লুপ
      let checkDbInterval = setInterval(() => {
        if (typeof initializeFirebase === 'function') {
          const isInitialized = initializeFirebase(); // config.js থেকে ফায়ারবেস ও অ্যানালিটিক্স রান হবে
          
          if (isInitialized && typeof db !== 'undefined' && db) {
            clearInterval(checkDbInterval); // লুপ বন্ধ
            console.log("🚀 Firebase DB & Analytics Linked successfully to Password Page!");
            
            // ডাটাবেজ রেডি হওয়ার পর বাটন ক্লিক ইভেন্ট সচল হবে
            enablePasswordChangeForm(userPhone, msgDiv);
          }
        }
      }, 100); // প্রতি ১০০ মিলি-সেকেন্ড পর পর ব্যাকগ্রাউন্ডে চেক করবে
    });

    // ৫. ফর্ম সাবমিশন ও বাটন অ্যাকশন হ্যান্ডলার
    function enablePasswordChangeForm(userPhone, msgDiv) {
      document.getElementById('changePasswordBtn').addEventListener('click', function() {
        const current = document.getElementById('currentPassword').value;
        const newPass = document.getElementById('newPassword').value;
        const confirm = document.getElementById('confirmPassword').value;
        
        if (!current || !newPass || !confirm) {
          showErrorMsg(msgDiv, 'সব ফিল্ড পূরণ করুন');
          return;
        }
        
        if (newPass.length < 6) {
          showErrorMsg(msgDiv, 'পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে');
          return;
        }
        
        if (newPass !== confirm) {
          showErrorMsg(msgDiv, 'নতুন পাসওয়ার্ড মিলছে না');
          return;
        }
        
        // গুগলের অ্যানালিটিক্স ট্র্যাকিং ইভেন্ট (পাসওয়ার্ড পরিবর্তনের চেষ্টা ট্র্যাকিং)
        if (typeof analytics !== 'undefined' && analytics) {
          firebase.analytics().logEvent('password_change_attempt', { user: userPhone });
        }
        
        // ComponentLoader এর মাধ্যমে পাসওয়ার্ড পরিবর্তন করা হচ্ছে
        if (typeof ComponentLoader !== 'undefined' && typeof ComponentLoader.changePassword === 'function') {
          ComponentLoader.changePassword(current, newPass)
            .then((result) => {
              // অ্যানালিটিক্স ইভেন্ট (সফল পরিবর্তন)
              if (typeof analytics !== 'undefined' && analytics) {
                firebase.analytics().logEvent('password_change_success');
              }

              msgDiv.textContent = result.message || 'পাসওয়ার্ড সফলভাবে পরিবর্তন করা হয়েছে';
              msgDiv.style.display = 'block';
              msgDiv.style.background = '#dcfce7';
              msgDiv.style.color = '#16a34a';
              msgDiv.style.border = '1px solid #bbf7d0';
              
              // ফিল্ড খালি করা
              document.getElementById('currentPassword').value = '';
              document.getElementById('newPassword').value = '';
              document.getElementById('confirmPassword').value = '';
              const indicator = document.querySelector('.password-strength');
              if (indicator) indicator.className = 'password-strength empty';
              
              Swal.fire('✅ সফল!', result.message || 'পাসওয়ার্ড পরিবর্তিত হয়েছে!', 'success');
              
              setTimeout(() => { msgDiv.style.display = 'none'; }, 3000);
            })
            .catch((error) => {
              showErrorMsg(msgDiv, error.message || 'পাসওয়ার্ড পরিবর্তন করতে সমস্যা হয়েছে');
              Swal.fire('❌ ত্রুটি!', error.message || 'পাসওয়ার্ড পরিবর্তন করতে সমস্যা হয়েছে', 'error');
            });
        } else {
          Swal.fire('❌ এরর!', 'ComponentLoader পাওয়া যায়নি বা সিস্টেমটি লোড হয়নি!', 'error');
        }
      });
      
      // Enter key ইভেন্ট লিসেনার
      document.getElementById('confirmPassword').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          document.getElementById('changePasswordBtn').click();
        }
      });
    }

    // এরর মেসেজ দেখানোর হেল্পার ফাংশন
    function showErrorMsg(msgDiv, text) {
      if (msgDiv) {
        msgDiv.textContent = text;
        msgDiv.style.display = 'block';
        msgDiv.style.background = '#fee2e2';
        msgDiv.style.color = '#dc2626';
        msgDiv.style.border = '1px solid #fecaca';
      }
    }
  </script>
</body>
</html>
